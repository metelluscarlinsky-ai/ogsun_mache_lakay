<!DOCTYPE html>
<html lang="ht"><head><meta charset="UTF-8"><title>Vin yon Machann - OGSUN</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
body{font-family:sans-serif;background:#0d1117;color:white;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
.box{background:#161b22;padding:30px;border-radius:10px;width:90%;max-width:400px;border:1px solid #30363d}
h2{color:#00d494;text-align:center}
input{width:100%;padding:12px;margin:8px 0;background:#0d1117;border:1px solid #30363d;color:white;border-radius:5px;box-sizing:border-box}
button{width:100%;padding:12px;background:#00d494;color:black;font-weight:bold;border:none;border-radius:5px;cursor:pointer;margin-top:10px}
a{color:#8b949e;display:block;text-align:center;margin-top:15px;text-decoration:none}
</style></head>
<body>

<div class="box">
    <h2><i class="fa-solid fa-store"></i> Vin yon Machann</h2>
    <form id="regForm">
        <input type="text" id="name" placeholder="Non Boutik ou" required>
        <input type="email" id="email" placeholder="Email (Kont Google)" required>
        <input type="text" id="phone" placeholder="Nimewo WhatsApp (Ekz: 32924776)" required>
        <input type="password" id="pass" placeholder="Modpas" required>
        <button type="submit" id="btn"><i class="fa-solid fa-user-plus"></i> Enskri Kounye a</button>
    </form>
    <div id="msg" style="color:#ef4444;text-align:center;margin-top:10px"></div>
    <a href="login.html">Ou gen kont deja? Konekte</a>
</div>

<script>
document.getElementById('regForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn');
    btn.textContent = 'K ap chaje...';
    btn.disabled = true;

    const res = await fetch('/api/merchant/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            phone: document.getElementById('phone').value,
            password: document.getElementById('pass').value
        })
    });
    
    const d = await res.json();
    if(d.success) {
        document.getElementById('msg').style.color = '#00d494';
        document.getElementById('msg').textContent = '✅ Kont ou kreye ak siksè! K ap redirije...';
        setTimeout(() => window.location.href = 'login.html', 2000);
    } else {
        document.getElementById('msg').textContent = '❌ ' + d.error;
        btn.textContent = 'Enskri Kounye a';
        btn.disabled = false;
    }
});
</script>

</body></html>
