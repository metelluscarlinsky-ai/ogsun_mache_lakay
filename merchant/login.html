<!DOCTYPE html>
<html lang="ht"><head><meta charset="UTF-8"><title>Machann Login - OGSUN</title>
<style>body{font-family:sans-serif;background:#0d1117;color:white;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}.box{background:#161b22;padding:30px;border-radius:10px;width:90%;max-width:400px;border:1px solid #30363d}h2{color:#00d494;text-align:center}input{width:100%;padding:12px;margin:8px 0;background:#0d1117;border:1px solid #30363d;color:white;border-radius:5px}button{width:100%;padding:12px;background:#00d494;color:black;font-weight:bold;border:none;border-radius:5px;cursor:pointer;margin-top:10px}a{color:#8b949e;display:block;text-align:center;margin-top:15px;text-decoration:none}</style></head>
<body><div class="box"><h2>🔐 Espas Machann</h2>
<form id="logForm"><input type="email" id="email" placeholder="Email" required><input type="password" id="pass" placeholder="Modpas" required><button type="submit">Konekte</button></form><div id="msg" style="color:#ef4444;text-align:center;margin-top:10px"></div><a href="register.html">Pa gen kont? Vin yon Machann</a></div>
<script>document.getElementById('logForm').addEventListener('submit',async(e)=>{e.preventDefault();const res=await fetch('/api/merchant/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('pass').value})});const d=await res.json();if(d.success){localStorage.setItem('merchant_token',d.token);localStorage.setItem('merchant_data',JSON.stringify(d.merchant));window.location.href='dashboard.html';}else{document.getElementById('msg').textContent='❌ '+d.error;}});</script></body></html>
