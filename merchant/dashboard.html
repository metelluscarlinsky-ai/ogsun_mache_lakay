<!DOCTYPE html>
<html lang="ht"><head><meta charset="UTF-8"><title>Dashboard Machann</title>
<style>body{font-family:sans-serif;background:#0d1117;color:white;margin:0;padding:20px}.header{display:flex;justify-content:space-between;background:#161b22;padding:15px;border-radius:10px;border:1px solid #30363d;margin-bottom:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.panel{background:#161b22;padding:20px;border-radius:10px;border:1px solid #30363d}h3{color:#00d494;margin-top:0}input,button{padding:10px;margin:5px 0;border-radius:5px;width:100%}input{background:#0d1117;border:1px solid #30363d;color:white}button{background:#00d494;color:black;font-weight:bold;border:none;cursor:pointer}.item{background:#0d1117;padding:10px;margin:5px 0;border-radius:5px;display:flex;justify-content:space-between}</style></head>
<body>
<div class="header"><div><strong style="color:#00d494" id="shopName">Boutik</strong><br><small id="shopId">ID: </small></div><a href="login.html" style="color:#ef4444;text-decoration:none" onclick="localStorage.clear()">Sòti</a></div>
<div class="grid">
<div class="panel"><h3>➕ Ajoute Pwodui</h3><form id="addForm"><input type="text" id="pName" placeholder="Non Pwodui" required><input type="number" id="pPrice" placeholder="Pri (GDS)" required><button type="submit">Ajoute</button></form><div id="msg" style="color:#00d494;margin-top:10px"></div></div>
<div class="panel"><h3>📦 Pwodui Mwen</h3><div id="myProducts"></div></div>
</div>
<script>
const token = localStorage.getItem('merchant_token');
const merchant = JSON.parse(localStorage.getItem('merchant_data') || '{}');
if(!token) window.location.href='login.html';
document.getElementById('shopName').textContent = merchant.name;
document.getElementById('shopId').textContent = 'ID: ' + merchant.id;

async function loadMyProducts() {
  const res = await fetch('/api/products');
  const all = await res.json();
  const mine = all.filter(p => p.merchant_id === merchant.id);
  document.getElementById('myProducts').innerHTML = mine.length > 0 ? mine.map(p => `<div class="item"><span>${p.name} - ${p.price} GDS</span></div>`).join('') : '<p style="color:#8b949e">Pa gen pwodui.</p>';
}
document.getElementById('addForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const res = await fetch('/api/admin/products', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify({ name: document.getElementById('pName').value, price: parseFloat(document.getElementById('pPrice').value), category_id: 1, image_url: 'logo.png', merchant_id: merchant.id, merchant_phone: merchant.phone, merchant_name: merchant.name })
  });
  const d = await res.json();
  if(d.success || res.status === 200) { document.getElementById('msg').textContent='✅ Pwodui ajoute!'; loadMyProducts(); }
});
loadMyProducts();
</script></body></html>
