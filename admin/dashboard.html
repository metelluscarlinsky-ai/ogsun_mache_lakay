<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - OGSUN</title>
    <!-- Nou itilize FontAwesome pou bèl ikòn -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #0b111e;
            --bg-sidebar: #131c2b;
            --bg-card: #1a2536;
            --border-color: #263346;
            --text-main: #e2e8f0;
            --text-muted: #8493a8;
            --accent-green: #00d494;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-gold: #f59e0b;
            --accent-red: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 250px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            z-index: 100;
        }

        .sidebar .logo {
            padding: 20px;
            font-size: 1.2rem;
            font-weight: 700;
            color: white;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar .logo i { color: var(--accent-green); }

        .sidebar nav { padding: 20px 10px; flex: 1; }
        
        .sidebar nav a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 8px;
            margin-bottom: 5px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s;
        }

        .sidebar nav a:hover, .sidebar nav a.active {
            background-color: rgba(0, 212, 148, 0.1);
            color: var(--accent-green);
        }

        .sidebar nav a.active { border-left: 3px solid var(--accent-green); }

        .sidebar .logout {
            padding: 20px;
            border-top: 1px solid var(--border-color);
        }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            flex: 1;
            margin-left: 250px;
            padding: 20px 30px;
            display: flex;
            flex-direction: column;
        }

        /* Topbar */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background-color: var(--bg-card);
            padding: 15px 25px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .topbar h2 { font-size: 1.2rem; color: white; font-weight: 600; }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255,255,255,0.05);
            padding: 5px 15px;
            border-radius: 30px;
        }
        .user-info img { width: 30px; height: 30px; border-radius: 50%; }

        /* Grid Layout */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        /* Stat Cards */
        .stat-card {
            background: var(--bg-card);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
            transition: transform 0.3s;
        }

        .stat-card:hover { transform: translateY(-5px); }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 4px;
        }

        .stat-card.green::before { background: var(--accent-green); }
        .stat-card.blue::before { background: var(--accent-blue); }
        .stat-card.purple::before { background: var(--accent-purple); }
        .stat-card.gold::before { background: var(--accent-gold); }

        .stat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .stat-icon {
            width: 40px; height: 40px;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem;
        }

        .stat-card.green .stat-icon { background: rgba(0,212,148,0.1); color: var(--accent-green); }
        .stat-card.blue .stat-icon { background: rgba(59,130,246,0.1); color: var(--accent-blue); }
        .stat-card.purple .stat-icon { background: rgba(139,92,246,0.1); color: var(--accent-purple); }
        .stat-card.gold .stat-icon { background: rgba(245,158,11,0.1); color: var(--accent-gold); }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: white;
            margin-bottom: 5px;
        }

        .stat-label { color: var(--text-muted); font-size: 0.85rem; }
        .stat-change { font-size: 0.75rem; margin-top: 10px; display: block; }
        .stat-change.positive { color: var(--accent-green); }

        /* Charts & Tables Row */
        .row-2 {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        .panel {
            background: var(--bg-card);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            padding: 20px;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .panel-header h3 { font-size: 1rem; color: white; font-weight: 600; }

        /* Bar Chart CSS */
        .chart-container {
            height: 200px;
            display: flex;
            align-items: flex-end;
            gap: 15px;
            padding-top: 20px;
        }

        .bar-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            height: 100%;
            justify-content: flex-end;
        }

        .bar {
            width: 100%;
            background: linear-gradient(180deg, var(--accent-green) 0%, rgba(0,212,148,0.2) 100%);
            border-radius: 5px 5px 0 0;
            transition: height 0.5s ease;
            position: relative;
        }

        .bar:hover { filter: brightness(1.2); }
        
        .bar-label { font-size: 0.75rem; color: var(--text-muted); }

        /* Tables */
        .data-list { display: flex; flex-direction: column; gap: 15px; }
        
        .data-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .data-item:last-child { border-bottom: none; padding-bottom: 0; }
        
        .data-left { display: flex; align-items: center; gap: 10px; }
        .data-icon {
            width: 35px; height: 35px; border-radius: 8px;
            background: rgba(255,255,255,0.05);
            display: flex; align-items: center; justify-content: center;
            color: var(--accent-gold);
        }

        .data-info h4 { font-size: 0.9rem; color: white; font-weight: 500; }
        .data-info p { font-size: 0.75rem; color: var(--text-muted); }
        .data-value { font-weight: 600; color: var(--accent-green); font-size: 0.9rem; }

        @media (max-width: 1024px) {
            .dashboard-grid { grid-template-columns: repeat(2, 1fr); }
            .row-2 { grid-template-columns: 1fr; }
        }
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main-content { margin-left: 0; }
            .dashboard-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="logo">
            <i class="fa-solid fa-leaf"></i> OGSUN ADMIN
        </div>
        <nav>
            <a href="dashboard.html" class="active"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
            <a href="products.html"><i class="fa-solid fa-box"></i> Pwodui</a>
            <a href="orders.html"><i class="fa-solid fa-cart-shopping"></i> Kòmand</a>
            <a href="affiliates.html"><i class="fa-solid fa-users"></i> Afilye</a>
            <a href="../index.html" target="_blank"><i class="fa-solid fa-globe"></i> Gade Sit</a>
        </nav>
        <div class="logout">
            <a href="#" onclick="logout()" style="color: var(--accent-red); display:flex; align-items:center; gap:10px; text-decoration:none;">
                <i class="fa-solid fa-right-from-bracket"></i> Dekonekte
            </a>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <!-- TOPBAR -->
        <header class="topbar">
            <h2>Overview Dashboard</h2>
            <div class="user-info">
                <span style="font-size: 0.9rem; color: white;">Admin OGSUN</span>
                <img src="../public/logo.png" alt="Admin" onerror="this.src='https://ui-avatars.com/api/?name=Admin&background=00d494&color=fff'">
            </div>
        </header>

        <!-- STATS GRID -->
        <div class="dashboard-grid">
            <div class="stat-card green">
                <div class="stat-header">
                    <div class="stat-icon"><i class="fa-solid fa-box"></i></div>
                </div>
                <div class="stat-value" id="totalProducts">0</div>
                <div class="stat-label">Pwodui Total</div>
                <span class="stat-change positive"><i class="fa-solid fa-arrow-up"></i> Aktif</span>
            </div>

            <div class="stat-card blue">
                <div class="stat-header">
                    <div class="stat-icon"><i class="fa-solid fa-cart-shopping"></i></div>
                </div>
                <div class="stat-value" id="totalOrders">0</div>
                <div class="stat-label">Kòmand Total</div>
                <span class="stat-change positive"><i class="fa-solid fa-arrow-up"></i> Nouvo</span>
            </div>

            <div class="stat-card gold">
                <div class="stat-header">
                    <div class="stat-icon"><i class="fa-solid fa-money-bill-trend-up"></i></div>
                </div>
                <div class="stat-value" id="totalRevenue">0 <span style="font-size:1rem;">GDS</span></div>
                <div class="stat-label">Revni Total</div>
                <span class="stat-change positive"><i class="fa-solid fa-arrow-up"></i> Tout tan</span>
            </div>

            <div class="stat-card purple">
                <div class="stat-header">
                    <div class="stat-icon"><i class="fa-solid fa-users"></i></div>
                </div>
                <div class="stat-value" id="totalAffiliates">0</div>
                <div class="stat-label">Afilye Aktif</div>
                <span class="stat-change positive"><i class="fa-solid fa-arrow-up"></i> K ap grandi</span>
            </div>
        </div>

        <!-- CHARTS & DATA ROW -->
        <div class="row-2">
            <!-- REVENUE CHART -->
            <div class="panel">
                <div class="panel-header">
                    <h3>Revni Semèn sa a</h3>
                    <i class="fa-solid fa-chart-simple" style="color: var(--text-muted);"></i>
                </div>
                <div class="chart-container" id="revenueChart">
                    <!-- JS pral ranpli sa a -->
                </div>
            </div>

            <!-- TOP AFILIYE -->
            <div class="panel">
                <div class="panel-header">
                    <h3>Top Afilye yo</h3>
                    <i class="fa-solid fa-trophy" style="color: var(--accent-gold);"></i>
                </div>
                <div class="data-list" id="topAffiliatesList">
                    <!-- JS pral ranpli sa a -->
                </div>
            </div>
        </div>

        <!-- RECENT ORDERS ROW -->
        <div class="panel">
            <div class="panel-header">
                <h3>Dènye Kòmand yo</h3>
                <a href="orders.html" style="color: var(--accent-green); font-size: 0.85rem; text-decoration: none;">Wè tout <i class="fa-solid fa-arrow-right"></i></a>
            </div>
            <div class="data-list" id="recentOrdersList">
                <!-- JS pral ranpli sa a -->
            </div>
        </div>

    </main>

    <script>
        if (!localStorage.getItem('admin_token')) {
            window.location.href = 'login.html';
        }

        const TOKEN = localStorage.getItem('admin_token');

        // Fonksyon pou fòma lajan
        function formatMoney(amount) {
            return parseFloat(amount).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
        }

        // Chaje tout done yo
        async function loadDashboard() {
            try {
                // 1. Chaje tout API yo an menm tan
                const [prodRes, orderRes, affRes] = await Promise.all([
                    fetch('/api/products').then(r => r.json()),
                    fetch('/api/admin/orders', { headers: { 'Authorization': 'Bearer ' + TOKEN } }).then(r => r.json()),
                    fetch('/api/admin/affiliates', { headers: { 'Authorization': 'Bearer ' + TOKEN } }).then(r => r.json())
                ]);

                // 2. Mete ajou kat estatik yo
                document.getElementById('totalProducts').textContent = prodRes.length || 0;
                document.getElementById('totalOrders').textContent = orderRes.length || 0;
                document.getElementById('totalAffiliates').textContent = affRes.length || 0;

                const totalRevenue = orderRes.reduce((sum, order) => sum + parseFloat(order.total || 0), 0);
                document.getElementById('totalRevenue').innerHTML = `${formatMoney(totalRevenue)} <span style="font-size:1rem;">GDS</span>`;

                // 3. Kreye graf revni semèn nan (7 dènye jou yo)
                renderChart(orderRes);

                // 4. Chaje Top 3 Afilye yo (ki baze sou komisyon total)
                const topAffs = [...affRes].sort((a, b) => (b.total_commission || 0) - (a.total_commission || 0)).slice(0, 3);
                const affContainer = document.getElementById('topAffiliatesList');
                
                if(topAffs.length > 0) {
                    affContainer.innerHTML = topAffs.map((aff, index) => `
                        <div class="data-item">
                            <div class="data-left">
                                <div class="data-icon" style="color: ${index === 0 ? 'var(--accent-gold)' : index === 1 ? '#c0c0c0' : '#cd7f32'}">
                                    <i class="fa-solid fa-medal"></i>
                                </div>
                                <div class="data-info">
                                    <h4>${aff.name}</h4>
                                    <p>Kòd: ${aff.code} (${aff.commission_percent}%)</p>
                                </div>
                            </div>
                            <div class="data-value">${formatMoney(aff.total_commission || 0)} GDS</div>
                        </div>
                    `).join('');
                } else {
                    affContainer.innerHTML = '<p style="color:var(--text-muted);text-align:center;font-size:0.85rem;">Pa gen afilye ankò.</p>';
                }

                // 5. Chaje 5 dènye kòmand yo
                const recentOrders = orderRes.slice(0, 5);
                const orderContainer = document.getElementById('recentOrdersList');
                
                if(recentOrders.length > 0) {
                    orderContainer.innerHTML = recentOrders.map(order => `
                        <div class="data-item">
                            <div class="data-left">
                                <div class="data-icon" style="color: var(--accent-blue);">
                                    <i class="fa-solid fa-bag-shopping"></i>
                                </div>
                                <div class="data-info">
                                    <h4>#${order.id} - ${order.customer_name}</h4>
                                    <p>${new Date(order.created_at).toLocaleDateString()}</p>
                                </div>
                            </div>
                            <div style="text-align:right;">
                                <div class="data-value">${formatMoney(order.total)} GDS</div>
                                ${order.affiliate_code ? `<p style="font-size:0.7rem; color:var(--accent-purple);">🤝 ${order.affiliate_code}</p>` : ''}
                            </div>
                        </div>
                    `).join('');
                } else {
                    orderContainer.innerHTML = '<p style="color:var(--text-muted);text-align:center;font-size:0.85rem;">Pa gen kòmand ankò.</p>';
                }

            } catch (err) {
                console.error('Erè chajman dashboard:', err);
            }
        }

        // Fonksyon pou dessine graf la ak CSS
        function renderChart(orders) {
            const container = document.getElementById('revenueChart');
            const days = ['Dim', 'Len', 'Ma', 'Mè', 'Je', 'Va', 'Sa'];
            const weekData = {};
            
            // Inisyalize 7 dènye jou yo ak 0
            for (let i = 6; i >= 0; i--) {
                const d = new Date();
                d.setDate(d.getDate() - i);
                weekData[d.toISOString().split('T')[0]] = 0;
            }

            // Kalkile revni pa jou
            orders.forEach(o => {
                const dateStr = (o.created_at || '').split('T')[0];
                if (weekData[dateStr] !== undefined) {
                    weekData[dateStr] += parseFloat(o.total || 0);
                }
            });

            const values = Object.values(weekData);
            const max = Math.max(...values, 1); // Evite divizyon pa 0
            const keys = Object.keys(weekData);

            container.innerHTML = keys.map((key, i) => {
                const val = values[i];
                const heightPct = (val / max) * 100;
                const d = new Date(key);
                
                return `
                    <div class="bar-wrapper">
                        <div class="bar" style="height: ${heightPct}%;" title="${formatMoney(val)} GDS"></div>
                        <span class="bar-label">${days[d.getDay()]}</span>
                    </div>
                `;
            }).join('');
        }

        function logout() {
            localStorage.removeItem('admin_token');
            window.location.href = 'login.html';
        }

        // Kòmanse
        loadDashboard();
    </script>
</body>
</html>
