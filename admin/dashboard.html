<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - OGSUN</title>
    <!-- Nou itilize Chart.js pou bèl grafik yo -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0d1117;
            --bg-panel: #161b22;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --accent-green: #00d494;
            --accent-dark-green: #238636;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body { background-color: var(--bg-dark); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar */
        .sidebar {
            width: 250px; background-color: var(--bg-panel);
            border-right: 1px solid var(--border-color);
            display: flex; flex-direction: column; padding: 20px 0;
        }
        .sidebar h2 { color: white; font-size: 1.2rem; padding: 0 20px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .sidebar h2 span { color: var(--accent-green); }
        .nav-links { display: flex; flex-direction: column; }
        .nav-links a {
            padding: 12px 20px; text-decoration: none; color: var(--text-muted);
            font-weight: 500; font-size: 0.9rem; display: flex; align-items: center; gap: 10px;
            transition: 0.2s; margin-bottom: 5px;
        }
        .nav-links a:hover, .nav-links a.active {
            background-color: rgba(0, 212, 148, 0.1); color: var(--accent-green);
            border-left: 3px solid var(--accent-green);
        }
        .sidebar-bottom { margin-top: auto; padding: 20px; border-top: 1px solid var(--border-color); }
        .sidebar-bottom a { color: #ef4444; text-decoration: none; font-weight: 600; font-size: 0.9rem; }

        /* Main Content */
        .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
        
        /* Topbar */
        .topbar {
            background-color: var(--bg-panel); border-bottom: 1px solid var(--border-color);
            padding: 15px 30px; display: flex; justify-content: space-between; align-items: center;
        }
        .search-bar { background: var(--bg-dark); border: 1px solid var(--border-color); border-radius: 20px; padding: 8px 15px; color: white; width: 300px; font-size: 0.9rem; }
        .user-profile { display: flex; align-items: center; gap: 10px; font-size: 0.9rem; font-weight: 600; }
        .user-profile img { width: 35px; height: 35px; border-radius: 50%; border: 2px solid var(--accent-green); }

        /* Dashboard Body */
        .dashboard-body { padding: 30px; }
        .page-title { margin-bottom: 25px; color: white; font-size: 1.5rem; }
        
        /* KPI Cards Row */
        .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 25px; }
        .kpi-card {
            background: var(--bg-panel); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 20px; position: relative; overflow: hidden;
        }
        .kpi-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px;
            background: var(--accent-green);
        }
        .kpi-title { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 10px; }
        .kpi-value { font-size: 1.8rem; font-weight: 700; color: white; margin-bottom: 5px; }
        .kpi-change { font-size: 0.8rem; color: var(--accent-green); display: flex; align-items: center; gap: 5px; }

        /* Charts Row */
        .charts-row { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 25px; }
        .chart-card {
            background: var(--bg-panel); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 20px;
        }
        .chart-title { font-size: 1rem; color: white; margin-bottom: 15px; font-weight: 600; }
        
        /* Table / List Row */
        .list-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .list-card {
            background: var(--bg-panel); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 20px;
        }
        .list-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 0; border-bottom: 1px solid var(--border-color);
        }
        .list-item:last-child { border-bottom: none; }
        .list-item-info { display: flex; flex-direction: column; }
        .list-item-name { color: white; font-weight: 500; font-size: 0.9rem; }
        .list-item-sub { color: var(--text-muted); font-size: 0.8rem; }
        .list-item-value { color: var(--accent-green); font-weight: 600; font-size: 0.9rem; }

        @media (max-width: 1024px) {
            .kpi-row { grid-template-columns: repeat(2, 1fr); }
            .charts-row, .list-row { grid-template-columns: 1fr; }
        }
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .kpi-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <h2><span>OGSUN</span> Admin</h2>
        <div class="nav-links">
            <a href="dashboard.html" class="active">📊 Dashboard</a>
            <a href="products.html">📦 Pwodui</a>
            <a href="orders.html">📋 Kòmand</a>
            <a href="affiliates.html">🤝 Afilye</a>
            <a href="../index.html" target="_blank">🌐 Gade Sit</a>
        </div>
        <div class="sidebar-bottom">
            <a href="#" onclick="logout()">🚪 Dekonekte</a>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <!-- TOPBAR -->
        <div class="topbar">
            <input type="text" class="search-bar" placeholder="🔍 Chèche...">
            <div class="user-profile">
                <span>Admin OGSUN</span>
                <img src="../public/logo.png" alt="Admin" onerror="this.src='https://ui-avatars.com/api/?name=Admin&background=00d494&color=fff'">
            </div>
        </div>

        <!-- DASHBOARD BODY -->
        <div class="dashboard-body">
            <h1 class="page-title">Overview Dashboard</h1>
            
            <!-- KPI Cards -->
            <div class="kpi-row">
                <div class="kpi-card">
                    <div class="kpi-title">Revni Total</div>
                    <div class="kpi-value" id="kpi-revenue">0 GDS</div>
                    <div class="kpi-change">↗ Tout tan</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-title">Kòmand Total</div>
                    <div class="kpi-value" id="kpi-orders">0</div>
                    <div class="kpi-change">↗ Nouvo kòmand</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-title">Afilye Aktif</div>
                    <div class="kpi-value" id="kpi-affiliates">0</div>
                    <div class="kpi-change">↗ K ap grandi</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-title">Pwodui nan Stòk</div>
                    <div class="kpi-value" id="kpi-products">0</div>
                    <div class="kpi-change">↗ Katalòg</div>
                </div>
            </div>

            <!-- Charts Row -->
            <div class="charts-row">
                <div class="chart-card">
                    <div class="chart-title">Revni Semèn sa a</div>
                    <canvas id="revenueChart" height="100"></canvas>
                </div>
                <div class="chart-card">
                    <div class="chart-title">Vant pa Kategori</div>
                    <canvas id="categoryChart" height="200"></canvas>
                </div>
            </div>

            <!-- List Row -->
            <div class="list-row">
                <div class="list-card">
                    <div class="chart-title">Dènye Kòmand yo</div>
                    <div id="recent-orders-list"></div>
                </div>
                <div class="list-card">
                    <div class="chart-title">Top Afilye yo</div>
                    <div id="top-affiliates-list"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        if (!localStorage.getItem('admin_token')) window.location.href = 'login.html';
        const TOKEN = localStorage.getItem('admin_token');

        function formatMoney(amount) {
            return parseFloat(amount).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
        }

        async function loadDashboard() {
            try {
                const [prodRes, orderRes, affRes] = await Promise.all([
                    fetch('/api/products').then(r => r.json()),
                    fetch('/api/admin/orders', { headers: { 'Authorization': 'Bearer ' + TOKEN } }).then(r => r.json()),
                    fetch('/api/admin/affiliates', { headers: { 'Authorization': 'Bearer ' + TOKEN } }).then(r => r.json())
                ]);

                // 1. Mete ajou KPI yo
                document.getElementById('kpi-products').textContent = prodRes.length || 0;
                document.getElementById('kpi-orders').textContent = orderRes.length || 0;
                document.getElementById('kpi-affiliates').textContent = affRes.length || 0;
                
                const totalRevenue = orderRes.reduce((sum, order) => sum + parseFloat(order.total || 0), 0);
                document.getElementById('kpi-revenue').textContent = formatMoney(totalRevenue) + ' GDS';

                // 2. Prepare done pou graf la
                const days = ['Dim', 'Len', 'Ma', 'Mè', 'Je', 'Va', 'Sa'];
                const weekData = {};
                for (let i = 6; i >= 0; i--) {
                    const d = new Date(); d.setDate(d.getDate() - i);
                    weekData[d.toISOString().split('T')[0]] = 0;
                }
                orderRes.forEach(o => {
                    const dateStr = (o.created_at || '').split('T')[0];
                    if (weekData[dateStr] !== undefined) weekData[dateStr] += parseFloat(o.total || 0);
                });
                
                const labels = Object.keys(weekData).map(k => days[new Date(k).getDay()]);
                const dataValues = Object.values(weekData);

                // 3. Kreye Chart.js Bar Chart
                const ctxBar = document.getElementById('revenueChart').getContext('2d');
                new Chart(ctxBar, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Revni (GDS)',
                            data: dataValues,
                            backgroundColor: '#00d494',
                            borderRadius: 5
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: { legend: { display: false } },
                        scales: {
                            y: { beginAtZero: true, grid: { color: '#30363d' }, ticks: { color: '#8b949e' } },
                            x: { grid: { display: false }, ticks: { color: '#8b949e' } }
                        }
                    }
                });

                // 4. Kreye Chart.js Doughnut Chart pou Kategori
                const catData = {};
                prodRes.forEach(p => {
                    const catName = p.categories?.name || 'Lòt';
                    catData[catName] = (catData[catName] || 0) + 1;
                });
                
                const ctxDonut = document.getElementById('categoryChart').getContext('2d');
                new Chart(ctxDonut, {
                    type: 'doughnut',
                    data: {
                        labels: Object.keys(catData),
                        datasets: [{
                            data: Object.values(catData),
                            backgroundColor: ['#00d494', '#238636', '#3fb950', '#2ea043', '#56d364', '#7ee787'],
                            borderWidth: 0
                        }]
                    },
                    options: {
                        cutout: '70%',
                        plugins: { legend: { position: 'bottom', labels: { color: '#8b949e' } } }
                    }
                });

                // 5. Ranpli Dènye Kòmand yo
                const recentOrders = orderRes.slice(0, 4);
                document.getElementById('recent-orders-list').innerHTML = recentOrders.length > 0 ? recentOrders.map(o => `
                    <div class="list-item">
                        <div class="list-item-info">
                            <span class="list-item-name">${o.customer_name}</span>
                            <span class="list-item-sub">#${o.id} - ${new Date(o.created_at).toLocaleDateString()}</span>
                        </div>
                        <span class="list-item-value">${formatMoney(o.total)} GDS</span>
                    </div>
                `).join('') : '<p style="color:#8b949e;text-align:center;padding:20px;">Pa gen kòmand.</p>';

                // 6. Ranpli Top Afilye yo
                const topAffs = [...affRes].sort((a, b) => (b.total_commission || 0) - (a.total_commission || 0)).slice(0, 4);
                document.getElementById('top-affiliates-list').innerHTML = topAffs.length > 0 ? topAffs.map(a => `
                    <div class="list-item">
                        <div class="list-item-info">
                            <span class="list-item-name">${a.name}</span>
                            <span class="list-item-sub">Kòd: ${a.code}</span>
                        </div>
                        <span class="list-item-value">${formatMoney(a.total_commission || 0)} GDS</span>
                    </div>
                `).join('') : '<p style="color:#8b949e;text-align:center;padding:20px;">Pa gen afilye.</p>';

            } catch (err) {
                console.error('Erè dashboard:', err);
            }
        }

        function logout() {
            localStorage.removeItem('admin_token');
            window.location.href = 'login.html';
        }

        loadDashboard();
    </script>
</body>
</html>
