<!DOCTYPE html>
<html lang="ht"><head><meta charset="UTF-8"><title>Kòmand - Admin</title>
<style>body{font-family:sans-serif;background:#0d1117;color:white;padding:20px}.container{max-width:1000px;margin:auto}.order-card{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:15px;margin-bottom:15px}.header{display:flex;justify-content:space-between;margin-bottom:10px}.btn-wa{background:#25d366;color:black;padding:8px 15px;border-radius:5px;text-decoration:none;font-weight:bold;display:inline-block;margin-top:10px}</style></head>
<body>
<div class="container"><h2>📋 Tout Kòmand yo</h2><a href="dashboard.html" style="color:#8b949e">← Dashboard</a><br><br><div id="list"></div></div>
<script>
const token = localStorage.getItem('admin_token');
if(!token) window.location.href='login.html';
async function loadOrders(){
  const res = await fetch('/api/admin/orders', { headers: { 'Authorization': 'Bearer ' + token } });
  const data = await res.json();
  document.getElementById('list').innerHTML = data.map(o => `
    <div class="order-card">
      <div class="header"><strong>#${o.id} - ${o.customer_name}</strong> <span>${o.total} GDS</span></div>
      <div style="color:#8b949e;font-size:0.9rem;margin-bottom:10px;">📞 Kliyan: ${o.customer_phone} | 📍 ${o.customer_address || '-'}</div>
      
      ${o.merchant_name ? `<div style="background:rgba(0,212,148,0.1);padding:10px;border-radius:5px;border-left:3px solid #00d494;margin-bottom:10px;">
        <strong style="color:#00d494;">Machann: ${o.merchant_name}</strong> (${o.merchant_phone})
      </div>` : '<div style="color:#8b949e;">Pwodui Admin</div>'}
      
      ${o.items ? o.items.map(i => `<div>• ${i.name} x${i.quantity} = ${i.price * i.quantity} GDS</div>`).join('') : ''}
      
      ${o.merchant_phone ? `
        <a href="https://wa.me/${o.merchant_phone}?text=*Kòmand #${o.id} sou OGSUN*%0A%0A*Kliyan:* ${o.customer_name}%0A*Telefòn:* ${o.customer_phone}%0A*Adrès:* ${o.customer_address}%0A%0A*Atik:*%0A${o.items.map(i => '- ' + i.name + ' x' + i.quantity).join('%0A')}%0A%0A*Total:* ${o.total} GDS%0A%0A⚠️ *Tanpri konfime pèman an pou n ka livre l.*" target="_blank" class="btn-wa">📲 Voye sou WhatsApp Machann lan</a>
      ` : ''}
    </div>
  `).join('');
}
loadOrders();
</script></body></html>
