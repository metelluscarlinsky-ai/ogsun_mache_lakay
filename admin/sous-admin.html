<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sous-Admin Dashboard - OGSUN</title>
    <link rel="stylesheet" href="../public/toast.css">
    <script src="../public/toast.js" defer></script>
    <style>
        :root {
            --bg-dark:#0f1923;--bg-card:#1a2733;--border:#2a3a4a;
            --text:#e0e0e0;--text-secondary:#8899aa;--accent:#ff6b6b;
            --accent2:#ff8e53;--gold:#f0c75e;--green:#00d4aa;
            --red:#ff4757;--purple:#9775fa;--blue:#4dabf7;
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Space Grotesk','Inter',sans-serif;background:var(--bg-dark);color:var(--text);min-height:100vh}
        header{background:var(--bg-card);border-bottom:1px solid var(--border);padding:16px 30px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:10px}
        header h1{color:var(--accent);font-size:1.4rem}
        nav{display:flex;gap:10px;flex-wrap:wrap}
        nav a{color:var(--text-secondary);text-decoration:none;padding:10px 18px;border-radius:10px;font-weight:500;font-size:0.9rem;transition:all 0.3s}
        nav a:hover,nav a.active{background:var(--border);color:white}
        nav a.active{background:var(--accent);color:white}
        .container{max-width:1400px;margin:0 auto;padding:25px}
        .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin-bottom:30px}
        .stat-card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:25px;transition:all 0.3s}
        .stat-card:hover{border-color:var(--accent);transform:translateY(-3px)}
        .stat-card .val{font-size:2.2rem;font-weight:700}
        .stat-card:nth-child(1) .val{color:var(--blue)}
        .stat-card:nth-child(2) .val{color:var(--gold)}
        .stat-card:nth-child(3) .val{color:var(--purple)}
        .stat-card:nth-child(4) .val{color:var(--green)}
        .stat-card .lbl{color:var(--text-secondary);font-size:0.9rem}
        .panel{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:25px;margin-bottom:20px}
        .panel h3{color:white;margin-bottom:15px;font-size:1.1rem}
        .section{display:none}
        .section.active{display:block}
        .grid-2{display:grid;grid-template-columns:1fr 1.5fr;gap:25px}
        @media(max-width:900px){.grid-2{grid-template-columns:1fr}}
        .form-group{margin-bottom:15px}
        .form-group label{display:block;color:var(--text-secondary);font-size:0.85rem;font-weight:600;margin-bottom:6px}
        .form-group input,.form-group select,.form-group textarea{width:100%;padding:12px 16px;background:var(--bg-dark);border:1px solid var(--border);border-radius:10px;color:white;font-size:0.95rem;font-family:inherit}
        .form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--accent)}
        .image-upload-area{border:2px dashed var(--border);border-radius:12px;padding:30px;text-align:center;cursor:pointer;background:var(--bg-dark)}
        .image-upload-area:hover{border-color:var(--accent)}
        .image-upload-area img{max-width:150px;max-height:150px;border-radius:10px;margin-top:10px}
        .btn-primary{background:var(--accent);color:white;border:none;padding:14px 28px;border-radius:12px;font-weight:700;cursor:pointer;width:100%;font-size:1rem}
        .btn-primary:hover{filter:brightness(1.2)}
        .btn-delete{background:var(--red);color:white;border:none;padding:6px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:0.8rem}
        .badge{padding:4px 10px;border-radius:20px;font-size:0.75rem;font-weight:600;display:inline-block}
        .badge-pending{background:rgba(240,199,94,0.15);color:var(--gold)}
        .badge-affiliate{background:rgba(151,117,250,0.15);color:var(--purple)}
        .product-item{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--border)}
        .order-card{background:var(--bg-dark);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:12px}
        .logout-btn{color:var(--red)!important}
    </style>
</head>
<body>

<header>
    <h1>🔐 Sous-Admin OGSUN</h1>
    <nav>
        <a href="#" class="active" onclick="showTab('stats',this)">📊 Estatistik</a>
        <a href="#" onclick="showTab('products',this)">📦 Pwodui</a>
        <a href="#" onclick="showTab('affiliates',this)">🤝 Afilye</a>
        <a href="#" onclick="showTab('orders',this)">📋 Kòmand</a>
        <a href="#" onclick="logout()" class="logout-btn">🚪 Sòti</a>
    </nav>
</header>

<div class="container">

    <!-- STATS -->
    <div id="tab-stats" class="section active">
        <div class="stats-grid">
            <div class="stat-card"><div class="val" id="sProducts">—</div><div class="lbl">Pwodui Total</div></div>
            <div class="stat-card"><div class="val" id="sOrders">—</div><div class="lbl">Kòmand Total</div></div>
            <div class="stat-card"><div class="val" id="sAffiliates">—</div><div class="lbl">Afilye Aktif</div></div>
            <div class="stat-card"><div class="val" id="sRevenue">— GDS</div><div class="lbl">Revni Total</div></div>
        </div>
    </div>

    <!-- PRODUCTS -->
    <div id="tab-products" class="section">
        <div class="grid-2">
            <div class="panel">
                <h3>➕ Ajoute Pwodui</h3>
                <div class="form-group"><label>📦 Non</label><input type="text" id="prodName"></div>
                <div class="form-group"><label>📝 Deskripsyon</label><textarea id="prodDesc" rows="2"></textarea></div>
                <div class="form-group"><label>💰 Pri (GDS)</label><input type="number" id="prodPrice" step="0.01"></div>
                <div class="form-group"><label>📂 Kategori</label><select id="prodCategory"></select></div>
                <div class="form-group"><label>🖼️ Foto</label>
                    <div class="image-upload-area" onclick="document.getElementById('prodImage').click()">
                        <span style="font-size:2rem;">📸</span><p style="color:var(--text-secondary);">Klike pou chwazi foto</p>
                        <img id="imagePreview" style="display:none;">
                    </div>
                    <input type="file" id="prodImage" accept="image/*" style="display:none;" onchange="previewImage()">
                </div>
                <button class="btn-primary" onclick="addProduct()">➕ Ajoute</button>
            </div>
            <div class="panel">
                <h3>📦 Lis Pwodui (<span id="prodCount">0</span>)</h3>
                <div id="productList" style="max-height:500px;overflow-y:auto;">Chajman...</div>
            </div>
        </div>
    </div>

    <!-- AFFILIATES -->
    <div id="tab-affiliates" class="section">
        <div class="grid-2">
            <div class="panel">
                <h3>➕ Ajoute Afilye</h3>
                <div class="form-group"><label>👤 Non</label><input type="text" id="affName"></div>
                <div class="form-group"><label>🔑 Kòd</label><input type="text" id="affCode" style="text-transform:uppercase;"></div>
                <div class="form-group"><label>💰 % Komisyon</label><input type="number" id="affCommission" value="5"></div>
                <button class="btn-primary" onclick="addAffiliate()">➕ Ajoute</button>
            </div>
            <div class="panel">
                <h3>🤝 Lis Afilye (<span id="affCount">0</span>)</h3>
                <div id="affiliateList" style="max-height:500px;overflow-y:auto;">Chajman...</div>
            </div>
        </div>
    </div>

    <!-- ORDERS -->
    <div id="tab-orders" class="section">
        <div class="panel">
            <h3>📋 Tout Kòmand yo (<span id="orderCount">0</span>)</h3>
            <div id="orderList" style="max-height:500px;overflow-y:auto;">Chajman...</div>
        </div>
    </div>

</div>

<script>
if(!localStorage.getItem('sous_admin_logged'))window.location.href='sous-admin.html';

function getToken(){return localStorage.getItem('admin_token')||'';}

function logout(){localStorage.removeItem('sous_admin_logged');window.location.href='sous-admin.html';}

function showTab(t,el){
    document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
    document.getElementById('tab-'+t).classList.add('active');
    document.querySelectorAll('nav a').forEach(a=>a.classList.remove('active'));
    el.classList.add('active');
    if(t==='stats')loadStats();
    if(t==='products'){loadCategories();loadProducts();}
    if(t==='affiliates')loadAffiliates();
    if(t==='orders')loadOrders();
}

function previewImage(){
    const f=document.getElementById('prodImage').files[0];
    if(f){const r=new FileReader();r.onload=e=>{document.getElementById('imagePreview').src=e.target.result;document.getElementById('imagePreview').style.display='block';};r.readAsDataURL(f);}
}

// ========== STATS ==========
async function loadStats(){
    const[p,o,a]=await Promise.all([
        fetch('/api/products').then(r=>r.json()),
        fetch('/api/admin/orders',{headers:{'Authorization':'Bearer '+getToken()}}).then(r=>r.json()).catch(()=>[]),
        fetch('/api/admin/affiliates',{headers:{'Authorization':'Bearer '+getToken()}}).then(r=>r.json()).catch(()=>[])
    ]);
    document.getElementById('sProducts').textContent=p.length;
    document.getElementById('sOrders').textContent=o.length;
    document.getElementById('sAffiliates').textContent=a.length;
    document.getElementById('sRevenue').textContent=o.reduce((s,x)=>s+parseFloat(x.total||0),0).toFixed(0)+' GDS';
}

// ========== CATEGORIES ==========
async function loadCategories(){
    const c=await fetch('/api/categories').then(r=>r.json());
    const s=document.getElementById('prodCategory');s.innerHTML='<option value="">Chwazi...</option>';
    c.forEach(x=>s.innerHTML+=`<option value="${x.id}">${x.name}</option>`);
}

// ========== PRODUCTS ==========
async function loadProducts(){
    const p=await fetch('/api/products').then(r=>r.json());
    document.getElementById('prodCount').textContent=p.length;
    document.getElementById('productList').innerHTML=p.map(x=>`
        <div class="product-item"><div style="display:flex;align-items:center;gap:10px;"><img src="${x.image_url||'../logo.png'}" style="width:35px;height:35px;border-radius:6px;object-fit:cover;" onerror="this.style.display='none'"><div><strong>${x.name}</strong><br><small style="color:var(--text-secondary);">${x.price} GDS</small></div></div><button class="btn-delete" onclick="deleteProduct(${x.id})">🗑️</button></div>`).join('');
}
async function addProduct(){
    const n=document.getElementById('prodName').value.trim(),d=document.getElementById('prodDesc').value.trim(),p=parseFloat(document.getElementById('prodPrice').value),c=parseInt(document.getElementById('prodCategory').value),img=document.getElementById('prodImage').files[0];
    if(!n||!p||!c)return alert('Ranpli non, pri, ak kategori!');
    let url='logo.png';
    if(img){const fd=new FormData();fd.append('image',img);const u=await fetch('/api/admin/upload',{method:'POST',headers:{'Authorization':'Bearer '+getToken()},body:fd}).then(r=>r.json());if(u.success)url=u.url;}
    const r=await fetch('/api/admin/products',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+getToken()},body:JSON.stringify({name:n,description:d,price:p,image_url:url,category_id:c})}).then(r=>r.json());
    if(r.success){if(typeof Toast!=='undefined')Toast.success('✅ Ajoute!');document.getElementById('prodName').value='';document.getElementById('prodPrice').value='';loadProducts();loadStats();}else alert('❌ '+r.error);
}
async function deleteProduct(id){if(!confirm('Retire?'))return;await fetch('/api/admin/products/'+id,{method:'DELETE',headers:{'Authorization':'Bearer '+getToken()}});loadProducts();loadStats();}

// ========== AFFILIATES ==========
async function loadAffiliates(){
    const a=await fetch('/api/admin/affiliates',{headers:{'Authorization':'Bearer '+getToken()}}).then(r=>r.json()).catch(()=>[]);
    document.getElementById('affCount').textContent=a.length;
    document.getElementById('affiliateList').innerHTML=a.map(x=>`<div class="product-item"><div><strong>${x.name}</strong> <span class="badge badge-affiliate">${x.code}</span> — ${x.commission_percent}%<br><small style="color:var(--text-secondary);">💰 ${(x.total_commission||0).toFixed(0)} GDS</small></div><button class="btn-delete" onclick="deleteAffiliate(${x.id})">🗑️</button></div>`).join('');
}
async function addAffiliate(){
    const n=document.getElementById('affName').value.trim(),c=document.getElementById('affCode').value.trim().toUpperCase(),comm=parseFloat(document.getElementById('affCommission').value)||5;
    if(!n||!c)return alert('Ranpli non ak kòd!');
    const r=await fetch('/api/admin/affiliates',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+getToken()},body:JSON.stringify({name:n,code:c,commission_percent:comm})}).then(r=>r.json());
    if(r.success){if(typeof Toast!=='undefined')Toast.success('✅ Ajoute!');loadAffiliates();loadStats();}else alert('❌ '+r.error);
}
async function deleteAffiliate(id){if(!confirm('Retire?'))return;await fetch('/api/admin/affiliates/'+id,{method:'DELETE',headers:{'Authorization':'Bearer '+getToken()}});loadAffiliates();loadStats();}

// ========== ORDERS ==========
async function loadOrders(){
    const o=await fetch('/api/admin/orders',{headers:{'Authorization':'Bearer '+getToken()}}).then(r=>r.json()).catch(()=>[]);
    document.getElementById('orderCount').textContent=o.length;
    document.getElementById('orderList').innerHTML=o.length===0?'<p style="text-align:center;color:var(--text-secondary);padding:40px;">Pa gen kòmand ankò</p>':o.map(x=>`
        <div class="order-card">
            <div style="display:flex;justify-content:space-between;margin-bottom:8px;"><strong>🛒 #${x.id} — ${x.customer_name}</strong><strong style="color:var(--green);">💰 ${x.total} GDS</strong></div>
            <div style="display:flex;gap:15px;flex-wrap:wrap;margin-bottom:8px;font-size:0.9rem;color:var(--text-secondary);"><span>📞 ${x.customer_phone}</span><span>📍 ${x.customer_address||'—'}</span></div>
            <div style="background:rgba(255,255,255,0.02);padding:8px;border-radius:8px;margin:8px 0;font-size:0.85rem;">${x.items?x.items.map(i=>`<div style="display:flex;justify-content:space-between;">${i.name} x${i.quantity||1} — ${(i.price*(i.quantity||1)).toFixed(2)} GDS</div>`).join(''):''}</div>
            ${x.affiliate_code?`<div style="padding:8px;background:rgba(151,117,250,0.08);border-radius:8px;margin-top:8px;"><span style="color:var(--purple);font-weight:700;">🤝 ${x.affiliate_code}</span>${x.affiliate_name?`<span style="color:var(--text-secondary);"> — ${x.affiliate_name}</span>`:''}</div>`:''}
            <div style="display:flex;justify-content:space-between;margin-top:8px;font-size:0.8rem;color:var(--text-secondary);"><span>📅 ${(x.created_at||'').split('T')[0]}</span><span class="badge badge-pending">${x.status||'pending'}</span></div>
        </div>`).join('');
}

loadStats();
loadCategories();
</script>
</body>
</html>
