<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sous-Admin OGSUN</title>
    <style>
        :root {
            --bg-dark: #0f1923;
            --bg-card: #1a2733;
            --border: #2a3a4a;
            --text: #e0e0e0;
            --text-secondary: #8899aa;
            --accent: #ff6b6b;
            --accent2: #ff8e53;
            --gold: #f0c75e;
            --green: #00d4aa;
            --red: #ff4757;
            --purple: #9775fa;
            --blue: #4dabf7;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Space Grotesk', 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Login Card */
        .login-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 50px 40px;
            width: 430px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-container .icon-lock {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 2rem;
            box-shadow: 0 10px 30px rgba(255,107,107,0.3);
        }

        .login-container h2 {
            color: white;
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .login-container .subtitle {
            color: var(--text-secondary);
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 1.2rem;
            z-index: 1;
        }

        .input-group input {
            width: 100%;
            padding: 16px 16px 16px 50px;
            background: var(--bg-dark);
            border: 2px solid var(--border);
            border-radius: 14px;
            color: white;
            font-size: 1rem;
            font-family: inherit;
            letter-spacing: 3px;
            text-align: center;
            transition: all 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(255,107,107,0.1);
        }

        .input-group input::placeholder {
            color: var(--text-secondary);
            letter-spacing: 0;
        }

        .btn-login {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: white;
            border: none;
            padding: 16px;
            width: 100%;
            border-radius: 14px;
            font-weight: 700;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.3s;
            letter-spacing: 1px;
        }

        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(255,107,107,0.4);
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        .error-msg {
            color: var(--red);
            margin-top: 15px;
            font-weight: 600;
            min-height: 24px;
        }

        .success-msg {
            color: var(--green);
            margin-top: 15px;
            font-weight: 600;
            min-height: 24px;
        }

        .back-link {
            display: block;
            margin-top: 25px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: var(--gold);
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255,107,107,0.4); }
            70% { box-shadow: 0 0 0 15px rgba(255,107,107,0); }
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="icon-lock">🔐</div>
    <h2>Sous-Admin OGSUN</h2>
    <p class="subtitle">Espas Sekrè — Antre kòd ou a</p>

    <div class="input-group">
        <span class="input-icon">🔑</span>
        <input type="password" id="code" placeholder="Kòd Sekrè" autocomplete="off">
    </div>

    <button class="btn-login pulse" onclick="login()">
        🚀 Aksè Sous-Admin
    </button>

    <div class="error-msg" id="errorMsg"></div>
    <div class="success-msg" id="successMsg"></div>

    <a href="../index.html" class="back-link">🏠 Retounen nan sit la</a>
</div>

<script>
const SOUS_CODE = 'OGSUN';

function login() {
    const code = document.getElementById('code').value.trim();
    const error = document.getElementById('errorMsg');
    const success = document.getElementById('successMsg');

    error.textContent = '';
    success.textContent = '';

    if (!code) {
        error.textContent = '❌ Antre kòd la!';
        return;
    }

    if (code === SOUS_CODE) {
        success.textContent = '✅ Kòd kòrèk! W ap redireje...';
        localStorage.setItem('sous_admin_logged', 'true');

        setTimeout(function() {
            window.location.href = 'sous-dashboard.html';
        }, 1000);
    } else {
        error.textContent = '❌ Kòd pa bon!';
    }
}

document.getElementById('code').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') login();
});
</script>
</body>
</html>
