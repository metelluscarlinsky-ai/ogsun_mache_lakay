<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sous-Admin - OGSUN</title>
    <link rel="stylesheet" href="../public/toast.css">
    <script src="../public/toast.js" defer></script>
    <style>
        :root {
            --bg-dark: #0f1923;
            --bg-card: #1a2733;
            --border: #2a3a4a;
            --text: #e0e0e0;
            --text-secondary: #8899aa;
            --accent: #ff6b6b;
            --accent2: #ff8e53;
            --gold: #f0c75e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Space Grotesk', 'Inter', sans-serif;
            background: var(--bg-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Background Animation */
        .bg-animation {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
        }

        .bg-animation .circle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.08;
            animation: float 20s infinite ease-in-out;
        }

        .bg-animation .circle:nth-child(1) {
            width: 400px; height: 400px;
            background: var(--accent);
            top: -100px; left: -100px;
            animation-delay: 0s;
        }

        .bg-animation .circle:nth-child(2) {
            width: 300px; height: 300px;
            background: var(--accent2);
            bottom: -50px; right: -50px;
            animation-delay: -7s;
        }

        .bg-animation .circle:nth-child(3) {
            width: 200px; height: 200px;
            background: var(--gold);
            top: 50%; left: 60%;
            animation-delay: -14s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(30px, -30px) scale(1.1); }
            50% { transform: translate(-20px, 20px) scale(0.9); }
            75% { transform: translate(-30px, -10px) scale(1.05); }
        }

        /* Login Card */
        .login-container {
            position: relative;
            z-index: 1;
            background: rgba(26, 39, 51, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 50px 40px;
            width: 430px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,107,107,0.1);
            animation: slideUp 0.6s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-container .icon-lock {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 2rem;
            box-shadow: 0 10px 30px rgba(255,107,107,0.3);
        }

        .login-container h2 {
            color: white;
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .login-container .subtitle {
            color: var(--text-secondary);
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 1.2rem;
            z-index: 1;
        }

        .input-group input {
            width: 100%;
            padding: 16px 16px 16px 50px;
            background: var(--bg-dark);
            border: 2px solid var(--border);
            border-radius: 14px;
            color: white;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s;
            letter-spacing: 2px;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(255,107,107,0.1);
        }

        .input-group input::placeholder {
            color: var(--text-secondary);
            letter-spacing: 0;
        }

        .btn-login {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: white;
            border: none;
            padding: 16px;
            width: 100%;
            border-radius: 14px;
            font-weight: 700;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.3s;
            margin-top: 10px;
            letter-spacing: 1px;
        }

        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(255,107,107,0.4);
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        .btn-login:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .error-msg {
            color: #ff4757;
            margin-top: 15px;
            font-weight: 600;
            min-height: 24px;
        }

        .back-link {
            display: block;
            margin-top: 25px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: var(--gold);
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255,107,107,0.4); }
            70% { box-shadow: 0 0 0 15px rgba(255,107,107,0); }
        }

        /* Dashboard */
        header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 16px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 { color: var(--accent); font-size: 1.4rem; }

        nav { display: flex; gap: 10px; flex-wrap: wrap; }

        nav a {
            color: var(--text-secondary);
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        nav a:hover, nav a.active { background: var(--border); color: white; }
        nav a.active { background: var(--accent); color: white; }

        .container { max-width: 1400px; margin: 0 auto; padding: 25px; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 30px; }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 25px;
            transition: all 0.3s;
        }

        .stat-card:hover { border-color: var(--accent); transform: translateY(-3px); }
        .stat-card .icon { font-size: 2rem; margin-bottom: 10px; }
        .stat-card .val { font-size: 2.2rem; font-weight: 700; color: var(--accent); }
        .stat-card .lbl { color: var(--text-secondary); font-size: 0.9rem; }

        .panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .panel h3 { color: white; margin-bottom: 15px; }

        .section { display: none; }
        .section.active { display: block; }
        .hidden { display: none; }

        .logout-btn { color: var(--accent) !important; }
    </style>
</head>
<body>

<!-- Background -->
<div class="bg-animation">
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
</div>

<!-- Login Section -->
<div id="loginSection" class="login-container">
    <div class="icon-lock">🔐</div>
    <h2>Sous-Admin OGSUN</h2>
    <p class="subtitle">Espas Sekrè — Antre kòd ou a</p>

    <div class="input-group">
        <span class="input-icon">🔑</span>
        <input type="password" id="sousCode" placeholder="Antre kòd sekrè a" autocomplete="off">
    </div>

    <button class="btn-login pulse" id="loginBtn" onclick="doLogin()">
        🚀 Aksè Sous-Admin
    </button>

    <div class="error-msg" id="errorMsg"></div>

    <a href="../index.html" class="back-link">🏠 Retounen nan sit la</a>
</div>

<!-- Dashboard Section -->
<div id="dashboardSection" class="hidden">
    <header>
        <h1>🔐 Sous-Admin OGSUN</h1>
        <nav>
            <a href="#" class="active" onclick="showTab('stats',this)">📊 Estatistik</a>
            <a href="#" onclick="showTab('products',this)">📦 Pwodui</a>
            <a href="#" onclick="showTab('affiliates',this)">🤝 Afilye</a>
            <a href="#" onclick="showTab('orders',this)">📋 Kòmand</a>
            <a href="#" onclick="logout()" class="logout-btn">🚪 Sòti</a>
        </nav>
    </header>
    <div class="container">
        <div id="tab-stats" class="section active">
            <div class="stats-grid">
                <div class="stat-card"><div class="icon">📦</div><div class="val" id="sProducts">—</div><div class="lbl">Pwodui Total</div></div>
                <div class="stat-card"><div class="icon">📋</div><div class="val" id="sOrders">—</div><div class="lbl">Kòmand Total</div></div>
                <div class="stat-card"><div class="icon">🤝</div><div class="val" id="sAffiliates">—</div><div class="lbl">Afilye Aktif</div></div>
                <div class="stat-card"><div class="icon">💰</div><div class="val" id="sRevenue">— GDS</div><div class="lbl">Revni Total</div></div>
            </div>
        </div>
        <div id="tab-products" class="section"><div class="panel"><h3>📦 Lis Pwodui yo</h3><div id="productList">—</div></div></div>
        <div id="tab-affiliates" class="section"><div class="panel"><h3>🤝 Lis Afilye yo</h3><div id="affiliateList">—</div></div></div>
        <div id="tab-orders" class="section"><div class="panel"><h3>📋 Dènye Kòmand yo</h3><div id="orderList">—</div></div></div>
    </div>
</div>

<script>
const SOUS_CODE = 'OGSUN'; // Kòd sekrè Sous-Admin

if (localStorage.getItem('sous_admin_logged')) showDashboard();

function doLogin() {
    const code = document.getElementById('sousCode').value.trim();
    const error = document.getElementById('errorMsg');
    const btn = document.getElementById('loginBtn');

    if (!code) {
        error.textContent = '❌ Antre kòd la!';
        return;
    }

    if (code === SOUS_CODE) {
        btn.textContent = '✅ Siksè!';
        btn.style.background = '#00d4aa';
        localStorage.setItem('sous_admin_logged', 'true');
        if (typeof Toast !== 'undefined') Toast.success('✅ Byenveni Sous-Admin! 🎉');
        if (typeof launchConfetti !== 'undefined') launchConfetti();
        setTimeout(showDashboard, 800);
    } else {
        error.textContent = '❌ Kòd pa bon!';
        btn.style.animation = 'none';
        btn.offsetHeight;
        btn.style.animation = '';
    }
}

function showDashboard() {
    document.getElementById('loginSection').classList.add('hidden');
    document.getElementById('dashboardSection').classList.remove('hidden');
    loadStats();
}

function logout() {
    localStorage.removeItem('sous_admin_logged');
    location.reload();
}

function showTab(t, el) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.getElementById('tab-' + t).classList.add('active');
    document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
    el.classList.add('active');
    if (t === 'stats') loadStats();
    if (t === 'products') loadProducts();
    if (t === 'affiliates') loadAffiliates();
    if (t === 'orders') loadOrders();
}

async function loadStats() {
    try {
        const [p, o, a] = await Promise.all([
            fetch('/api/products').then(r => r.json()),
            fetch('/api/admin/orders', { headers: { 'Authorization': 'Bearer ' + (localStorage.getItem('admin_token') || '') } }).then(r => r.json()).catch(() => []),
            fetch('/api/admin/affiliates', { headers: { 'Authorization': 'Bearer ' + (localStorage.getItem('admin_token') || '') } }).then(r => r.json()).catch(() => [])
        ]);
        document.getElementById('sProducts').textContent = p.length;
        document.getElementById('sOrders').textContent = o.length;
        document.getElementById('sAffiliates').textContent = a.length;
        document.getElementById('sRevenue').textContent = (o.reduce((s, x) => s + parseFloat(x.total || 0), 0)).toFixed(0) + ' GDS';
    } catch (e) {}
}

async function loadProducts() {
    const d = await fetch('/api/products').then(r => r.json());
    document.getElementById('productList').innerHTML = d.map(x => `
        <div style="display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid var(--border);">
            <span>${x.name} - <strong style="color:var(--accent);">${x.price} GDS</strong></span>
            <span style="color:var(--text-secondary);">${x.categories?.name || ''}</span>
        </div>`).join('');
}

async function loadAffiliates() {
    const d = await fetch('/api/admin/affiliates', { headers: { 'Authorization': 'Bearer ' + (localStorage.getItem('admin_token') || '') } }).then(r => r.json()).catch(() => []);
    document.getElementById('affiliateList').innerHTML = d.map(x => `
        <div style="display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid var(--border);">
            <span>${x.name} (<span style="color:#9775fa;">${x.code}</span>) - ${x.commission_percent}%</span>
            <span style="color:var(--accent);">${(x.total_commission || 0).toFixed(0)} GDS</span>
        </div>`).join('');
}

async function loadOrders() {
    const d = await fetch('/api/admin/orders', { headers: { 'Authorization': 'Bearer ' + (localStorage.getItem('admin_token') || '') } }).then(r => r.json()).catch(() => []);
    document.getElementById('orderList').innerHTML = d.slice(0, 10).map(x => `
        <div style="padding:12px;border-bottom:1px solid var(--border);">
            <strong>#${x.id}</strong> ${x.customer_name} - <strong style="color:var(--accent);">${x.total} GDS</strong>
            ${x.affiliate_code ? `<span style="background:rgba(151,117,250,0.15);color:#9775fa;padding:2px 8px;border-radius:10px;font-size:0.8rem;float:right;">🤝 ${x.affiliate_code}</span>` : ''}
            <br><small style="color:var(--text-secondary);">📞 ${x.customer_phone} | ${(x.created_at || '').split('T')[0]}</small>
        </div>`).join('');
}

document.getElementById('sousCode').addEventListener('keypress', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
