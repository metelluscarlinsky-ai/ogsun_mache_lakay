<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OGSUN MACHE LAKAY</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <div class="logo">
        <img src="logo.png" alt="OGSUN Logo">
        <span>OGSUN MACHE LAKAY</span>
    </div>
    <nav>
        <a href="cart.html" class="cart-icon">🛒 <span id="cart-badge" class="cart-badge">0</span></a>
    </nav>
</header>

<div class="container">
    <div id="category-filters" class="category-filters"></div>
    <div id="product-grid" class="product-grid"></div>
</div>

<footer>
    <p>&copy; 2026 OGSUN MACHE LAKAY</p>
</footer>

<script>
let cart = JSON.parse(localStorage.getItem('ogsun_cart')) || [];

function updateCartBadge() {
    const total = cart.reduce((sum, item) => sum + item.quantity, 0);
    document.getElementById('cart-badge').textContent = total;
}

window.addToCart = function(product) {
    const existing = cart.find(item => item.id === product.id);
    if (existing) existing.quantity += 1;
    else cart.push({...product, quantity: 1});
    localStorage.setItem('ogsun_cart', JSON.stringify(cart));
    updateCartBadge();
    alert('✅ ' + product.name + ' ajoute nan panier!');
};

async function loadCategories() {
    try {
        const res = await fetch('/api/categories');
        const categories = await res.json();
        const container = document.getElementById('category-filters');
        container.innerHTML = '<button class="category-btn active" onclick="loadProducts(\'\')">🌟 Tout</button>';
        categories.forEach(cat => {
            container.innerHTML += `<button class="category-btn" onclick="loadProducts('${cat.slug}')">${cat.name}</button>`;
        });
    } catch(e) { console.error(e); }
}

async function loadProducts(categorySlug = '') {
    try {
        let url = '/api/products';
        if (categorySlug) url += '?category=' + categorySlug;
        const res = await fetch(url);
        const products = await res.json();
        const grid = document.getElementById('product-grid');
        
        if (products.length === 0) {
            grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;">Pa gen pwodui.</p>';
            return;
        }
        
        grid.innerHTML = products.map(prod => `
            <div class="product-card">
                <img src="${prod.image_url || 'logo.png'}" alt="${prod.name}" onerror="this.src='logo.png'">
                <div class="product-info">
                    <span class="category">📂 ${prod.categories?.name || ''}</span>
                    <h3>${prod.name}</h3>
                    <div class="price">💰 ${parseFloat(prod.price).toFixed(2)} GDS</div>
                    <button class="add-to-cart" onclick='addToCart(${JSON.stringify(prod).replace(/'/g, "&#39;")})'>🛒 Ajoute</button>
                </div>
            </div>
        `).join('');
    } catch(e) { 
        document.getElementById('product-grid').innerHTML = '<p style="grid-column:1/-1;text-align:center;color:red;">Erè koneksyon ak sèvè a.</p>';
    }
}

loadCategories();
loadProducts();
updateCartBadge();
</script>
</body>
</html>
