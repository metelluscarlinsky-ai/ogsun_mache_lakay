<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OGSUN MACHE LAKAY 2026</title>
    <!-- Lyen pou bèl ikòn yo (FontAwesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <div class="logo">
        <img src="logo.png" alt="OGSUN Logo">
        <span>OGSUN MACHE LAKAY</span>
    </div>
    <nav>
        <a href="index.html"><i class="fa-solid fa-house"></i> Akèy</a>
        <a href="about.html"><i class="fa-solid fa-circle-info"></i> Sou Nou</a>
        <a href="merchant/login.html"><i class="fa-solid fa-store"></i> Espas Machann</a>
        <a href="affiliate/login.html"><i class="fa-solid fa-handshake"></i> Afilye</a>
        <a href="cart.html" class="cart-icon"><i class="fa-solid fa-cart-shopping"></i> <span id="cart-badge" class="cart-badge">0</span></a>
    </nav>
</header>

<div class="container">
    <div class="hero-banner">
        <h1><i class="fa-solid fa-store"></i> Byenveni nan OGSUN</h1>
        <p>Pi bon mache lokal ou a — Livrezon rapid nan Gonayiv ak tout peyi a!</p>
    </div>
    
    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Chèche yon pwodui... (ekzanp: diri, mayo)">
        <button onclick="searchProducts()"><i class="fa-solid fa-magnifying-glass"></i> Chèche</button>
    </div>
    
    <div id="category-filters" class="category-filters"></div>
    <div id="product-grid" class="product-grid"></div>
</div>

<footer>
    <p>&copy; 2026 OGSUN MACHE LAKAY - Tout dwa rezève</p>
    <p><i class="fa-brands fa-whatsapp"></i> 32924776 | <i class="fa-solid fa-envelope"></i> metelluscarlinsky@gmail.com</p>
</footer>

<script>
let cart = JSON.parse(localStorage.getItem('ogsun_cart')) || [];

function updateCartBadge() {
    const total = cart.reduce((sum, item) => sum + item.quantity, 0);
    document.getElementById('cart-badge').textContent = total;
}

window.addToCart = function(product) {
    const existing = cart.find(item => item.id === product.id);
    if (existing) existing.quantity += 1;
    else cart.push({...product, quantity: 1});
    localStorage.setItem('ogsun_cart', JSON.stringify(cart));
    updateCartBadge();
    alert('Pwodui ajoute nan panier!');
};

async function loadCategories() {
    try {
        const res = await fetch('/api/categories');
        const categories = await res.json();
        const container = document.getElementById('category-filters');
        container.innerHTML = '<button class="category-btn active" onclick="loadProducts(\'\')"><i class="fa-solid fa-star"></i> Tout</button>';
        categories.forEach(cat => {
            container.innerHTML += `<button class="category-btn" onclick="loadProducts('${cat.id}')">${cat.name}</button>`;
        });
    } catch(e) { console.log(e); }
}

async function loadProducts(categoryId = '') {
    const grid = document.getElementById('product-grid');
    grid.innerHTML = '<p style="text-align:center; width:100%;">Chajman...</p>';
    
    try {
        const res = await fetch('/api/products');
        let products = await res.json();
        
        if (categoryId) {
            products = products.filter(p => p.category_id == categoryId);
        }

        if (products.length === 0) {
            grid.innerHTML = '<p style="text-align:center; width:100%;">Pa gen pwodui.</p>';
            return;
        }

        grid.innerHTML = products.map(prod => `
            <div class="product-card">
                <img src="${prod.image_url || 'logo.png'}" alt="${prod.name}" onerror="this.src='logo.png'">
                <div class="product-info">
                    <span class="category">${prod.categories?.name || ''}</span>
                    <h3>${prod.name}</h3>
                    <div class="price">${parseFloat(prod.price).toFixed(2)} GDS</div>
                    <button class="add-to-cart" onclick='addToCart(${JSON.stringify(prod).replace(/'/g, "&#39;")})'>
                        <i class="fa-solid fa-cart-plus"></i> Ajoute
                    </button>
                </div>
            </div>
        `).join('');
    } catch(e) {
        grid.innerHTML = '<p style="text-align:center; color:red; width:100%;">Erè koneksyon ak sèvè a.</p>';
    }
}

loadCategories();
loadProducts();
updateCartBadge();
</script>
</body>
</html>
