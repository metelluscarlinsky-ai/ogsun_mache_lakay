<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afilye Login - OGSUN MACHE LAKAY</title>
    <link rel="stylesheet" href="../public/style.css">
    <link rel="stylesheet" href="../public/toast.css">
    <script src="../public/toast.js" defer></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--primary) 0%, #1a5c1a 100%);
            font-family: 'Space Grotesk', 'Poppins', sans-serif;
        }
        .login-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
            width: 420px;
            text-align: center;
            border: 1px solid rgba(212,160,23,0.3);
        }
        .login-container img {
            width: 80px;
            border-radius: 50%;
            margin-bottom: 20px;
            border: 3px solid var(--gold);
        }
        .login-container h2 {
            color: var(--primary);
            margin-bottom: 10px;
            font-size: 1.8rem;
        }
        .login-container p {
            color: #666;
            margin-bottom: 25px;
        }
        .login-container input {
            display: block;
            width: 100%;
            margin: 15px 0;
            padding: 16px;
            border: 2px solid #e0d6c2;
            border-radius: 12px;
            font-size: 1.1rem;
            text-align: center;
            font-weight: 700;
            letter-spacing: 2px;
            font-family: inherit;
            transition: all 0.3s;
            text-transform: uppercase;
        }
        .login-container input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(212,160,23,0.2);
        }
        .login-container button {
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: var(--primary);
            border: none;
            padding: 16px;
            width: 100%;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            font-size: 1.1rem;
            margin-top: 15px;
            transition: all 0.3s;
        }
        .login-container button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(212,160,23,0.4);
        }
        .login-container button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .msg {
            margin-top: 15px;
            font-weight: 600;
            min-height: 24px;
        }
    </style>
</head>
<body>

<div class="login-container">
    <img src="../public/logo.png" alt="OGSUN Logo" onerror="this.style.display='none'">
    <h2>🤝 Espas Afilye</h2>
    <p>Antre kòd afilye w la pou w jwenn aksè</p>
    
    <input type="text" id="code" placeholder="🔑 Kòd Afilye" autocomplete="off" maxlength="10">
    
    <button id="btn" onclick="login()">🚀 Konekte</button>
    
    <div id="msg" class="msg"></div>
    
    <p style="margin-top:20px;font-size:0.9rem;">
        <a href="../index.html" style="color:var(--gold);">🏠 Retounen nan Akèy</a>
    </p>
</div>

<script>
async function login() {
    const code = document.getElementById('code').value.trim().toUpperCase();
    const btn = document.getElementById('btn');
    const msg = document.getElementById('msg');
    
    if (!code) {
        msg.style.color = 'red';
        msg.textContent = '❌ Antre yon kòd afilye!';
        return;
    }
    
    btn.disabled = true;
    btn.textContent = '⏳ Chajman...';
    msg.textContent = '';
    
    try {
        const res = await fetch('/api/affiliates');
        const data = await res.json();
        const found = data.find(a => a.code === code);
        
        if (found) {
            msg.style.color = 'green';
            msg.textContent = '✅ ' + found.name + ' — Byenveni!';
            localStorage.setItem('affiliate_code', found.code);
            localStorage.setItem('affiliate_name', found.name);
            
            if (typeof Toast !== 'undefined') {
                Toast.success('✅ Byenveni, ' + found.name + '!');
            }
            if (typeof launchConfetti !== 'undefined') {
                launchConfetti();
            }
            
            setTimeout(function() {
                window.location.href = 'dashboard.html';
            }, 1000);
        } else {
            msg.style.color = 'red';
            msg.textContent = '❌ Kòd pa valid!';
        }
    } catch(e) {
        msg.style.color = 'red';
        msg.textContent = '❌ Sèvè pa disponib!';
    }
    
    btn.disabled = false;
    btn.textContent = '🚀 Konekte';
}

document.getElementById('code').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') login();
});
</script>
</body>
</html>
